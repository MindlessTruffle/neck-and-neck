services:
  game:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 8787
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?Set ALLOWED_ORIGINS in deploy/.env}
      MAX_ROOMS: ${MAX_ROOMS:-8}
      MAX_CONNECTIONS: ${MAX_CONNECTIONS:-64}
      TRUST_PROXY: "true"
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 768m
    cpus: 1.5
    logging:
      options: {max-size: "5m", max-file: "2"}
    # No host port: only Caddy can reach the game inside this private network.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      game:
        condition: service_healthy
    environment:
      CLUB_HOST: ${CLUB_HOST:?Set CLUB_HOST to your DNS hostname}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    logging:
      options: {max-size: "5m", max-file: "2"}
volumes:
  caddy_data:
  caddy_config:
