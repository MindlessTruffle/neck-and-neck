<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Neck & Neck device preview</title><style>body{margin:20px;background:#203646;color:#fff;font:18px system-ui}button,select{font:inherit;padding:10px;margin:0 8px 12px 0}iframe{border:0;display:block;transform-origin:top left;background:#bce4ec}#wrap{width:100%;height:650px}#size{margin:8px 0}</style></head><body><h1>Device preview</h1><button id="portrait">Phone portrait</button><button id="landscape">Phone landscape</button><button id="desktop">Desktop</button><label>View <select id="view"><option value="/">Game</option><option value="/tests/visual.html">Arena checks</option></select></label><div id="size"></div><div id="wrap"><iframe title="Game device preview" src="/"></iframe></div><script type="module">
const frame=document.querySelector('iframe');function size(w,h,scale=1){frame.style.width=`${w}px`;frame.style.height=`${h}px`;frame.style.transform=`scale(${scale})`;document.querySelector('#size').textContent=`${w} × ${h} CSS pixels`;frame.src=document.querySelector('#view').value;}
document.querySelector('#portrait').onclick=()=>size(390,844,.65);document.querySelector('#landscape').onclick=()=>size(844,390);document.querySelector('#desktop').onclick=()=>size(1280,720,.75);document.querySelector('#view').onchange=()=>{frame.src=document.querySelector('#view').value};size(390,844,.65);
</script></body></html>
